<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Companies | Career Pilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon"><i
                        class="bi bi-rocket-takeoff"></i></span>CAREER PILOT</a>
            <button class="navbar-toggler border-0" type="button" data-nav-toggle="true"><i
                    class="bi bi-list fs-3"></i></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="companies.html">Companies</a></li>
                    <li class="nav-item"><a class="nav-link" href="practice.html">Practice</a></li>
                    <li class="nav-item"><a class="nav-link" href="interviews.html">Interviews</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Pricing</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="login.html" class="btn btn-outline-primary">Login</a>
                    <a href="register.html" class="btn btn-primary">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileNav">
        <div class="offcanvas-header">
            <h5>Career Pilot</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-grid gap-2"><a href="index.html" class="btn btn-soft text-start">Home</a><a
                href="companies.html" class="btn btn-soft text-start">Companies</a><a href="practice.html"
                class="btn btn-soft text-start">Practice</a><a href="interviews.html"
                class="btn btn-soft text-start">Interviews</a><a href="pricing.html"
                class="btn btn-soft text-start">Pricing</a><a href="login.html"
                class="btn btn-outline-primary">Login</a><a href="register.html" class="btn btn-primary">Get Started</a>
        </div>
    </div>

    <main class="container py-5">
        <div class="page-banner mb-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <p class="text-muted mb-2">Company Hub</p>
                    <h1 class="display-6 fw-bold mb-0">Explore top companies</h1>
                </div>
                <a href="company-details.html?id=google" class="btn btn-primary">Popular company</a>
            </div>
        </div>

        <div class="card p-4 mb-4">
            <div class="row g-3">
                <div class="col-lg-4">
                    <input id="companySearch" type="search" class="form-control" placeholder="Search company or role"
                        aria-label="Search companies" />
                </div>
                <div class="col-lg-2">
                    <select id="industryFilter" class="form-select" aria-label="Filter by industry"></select>
                </div>
                <div class="col-lg-2">
                    <select id="difficultyFilter" class="form-select" aria-label="Filter by difficulty"></select>
                </div>
                <div class="col-lg-2">
                    <select id="roleFilter" class="form-select" aria-label="Filter by role"></select>
                </div>
                <div class="col-lg-2">
                    <select id="companySort" class="form-select" aria-label="Sort companies">
                        <option value="name">Sort: Name</option>
                        <option value="progress">Sort: Progress</option>
                        <option value="difficulty">Sort: Difficulty</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="companyGrid" class="row g-4"></div>
    </main>

    <footer>...</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/companies.js"></script>
</body>

</html>
