<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Career Pilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon"><i
                        class="bi bi-rocket-takeoff"></i></span>CAREER PILOT</a>
            <button class="navbar-toggler border-0" type="button" data-nav-toggle="true"><i
                    class="bi bi-list fs-3"></i></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="companies.html">Companies</a></li>
                    <li class="nav-item"><a class="nav-link" href="practice.html">Practice</a></li>
                    <li class="nav-item"><a class="nav-link" href="interviews.html">Interviews</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Pricing</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2">
                    <a href="register.html" class="btn btn-primary">Get Started</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileNav" aria-labelledby="mobileNavLabel">
        <div class="offcanvas-header">
            <h5 id="mobileNavLabel">Career Pilot</h5><button type="button" class="btn-close"
                data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-grid gap-2">
            <a href="index.html" class="btn btn-soft text-start">Home</a>
            <a href="companies.html" class="btn btn-soft text-start">Companies</a>
            <a href="practice.html" class="btn btn-soft text-start">Practice</a>
            <a href="interviews.html" class="btn btn-soft text-start">Interviews</a>
            <a href="pricing.html" class="btn btn-soft text-start">Pricing</a>
            <a href="register.html" class="btn btn-primary">Get Started</a>
        </div>
    </div>

    <main class="auth-shell">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
                <h2 class="fw-bold">Welcome back</h2>
                <p class="text-muted mb-0">Sign in to continue your preparation journey.</p>
            </div>

            <form data-submit-message="Login successful">
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required />
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" />
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="text-decoration-none small">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
                <div class="text-center small text-muted">New here? <a href="register.html">Create an account</a></div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
