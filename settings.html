<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Career Pilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon"><i
                        class="bi bi-rocket-takeoff"></i></span>CAREER PILOT</a>
            <div class="ms-auto"><a href="dashboard.html" class="btn btn-outline-primary">Dashboard</a></div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card p-4 p-md-5">
            <h2 class="mb-4">Settings</h2>
            <ul class="nav nav-pills mb-4" id="settingsTabs" role="tablist">
                <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="pill"
                        data-bs-target="#account" type="button">Account</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill"
                        data-bs-target="#notifications" type="button">Notifications</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill"
                        data-bs-target="#appearance" type="button">Appearance</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill"
                        data-bs-target="#interviewPrefs" type="button">Interview Preferences</button></li>
                <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="pill"
                        data-bs-target="#privacy" type="button">Privacy</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="account">
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Name</label><input type="text"
                                    class="form-control" value="Aarav Mehta" /></div>
                            <div class="col-md-6"><label class="form-label">Email</label><input type="email"
                                    class="form-control" value="aarav@careerpilot.ai" /></div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-4">Update account</button>
                    </form>
                </div>
                <div class="tab-pane fade" id="notifications">
                    <div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked /><label
                            class="form-check-label">Weekly goal reminders</label></div>
                    <div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox"
                            checked /><label class="form-check-label">Interview feedback alerts</label></div>
                </div>
                <div class="tab-pane fade" id="appearance">
                    <div class="form-check form-switch"><input class="form-check-input" type="checkbox"
                            id="appearanceSwitch" /><label class="form-check-label">Enable dark mode</label></div>
                </div>
                <div class="tab-pane fade" id="interviewPrefs">
                    <div class="mb-3"><label class="form-label">Preferred interview style</label><select
                            class="form-select">
                            <option>Standard</option>
                            <option>Technical Focus</option>
                            <option>Behavioral Focus</option>
                        </select></div>
                    <div class="mb-3"><label class="form-label">Preferred difficulty</label><select class="form-select">
                            <option>Medium</option>
                            <option>Easy</option>
                            <option>Hard</option>
                        </select></div>
                </div>
                <div class="tab-pane fade" id="privacy">
                    <div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked /><label
                            class="form-check-label">Make profile visible to employers</label></div>
                    <div class="form-check form-switch mt-3"><input class="form-check-input" type="checkbox" /><label
                            class="form-check-label">Allow analytics personalization</label></div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
