<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Career Pilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <main class="auth-shell">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3"><i class="bi bi-key"></i></div>
                <h2 class="fw-bold">Reset your password</h2>
                <p class="text-muted mb-0">Enter your email and we’ll send a reset link.</p>
            </div>
            <form data-submit-message="Reset link sent successfully">
                <div class="mb-3">
                    <label for="resetEmail" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="resetEmail" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Send reset link</button>
                <div class="text-center mt-3 small"><a href="login.html">Back to login</a></div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
