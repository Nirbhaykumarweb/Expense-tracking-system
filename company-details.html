<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Details | Career Pilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon"><i
                        class="bi bi-rocket-takeoff"></i></span>CAREER PILOT</a><button class="navbar-toggler border-0"
                type="button" data-nav-toggle="true"><i class="bi bi-list fs-3"></i></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="companies.html">Companies</a></li>
                    <li class="nav-item"><a class="nav-link" href="practice.html">Practice</a></li>
                    <li class="nav-item"><a class="nav-link" href="interviews.html">Interviews</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Pricing</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2"><a href="login.html"
                        class="btn btn-outline-primary">Login</a><a href="register.html" class="btn btn-primary">Get
                        Started</a></div>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileNav">
        <div class="offcanvas-header">
            <h5>Career Pilot</h5><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-grid gap-2"><a href="index.html" class="btn btn-soft text-start">Home</a><a
                href="companies.html" class="btn btn-soft text-start">Companies</a><a href="practice.html"
                class="btn btn-soft text-start">Practice</a><a href="interviews.html"
                class="btn btn-soft text-start">Interviews</a><a href="pricing.html"
                class="btn btn-soft text-start">Pricing</a><a href="login.html"
                class="btn btn-outline-primary">Login</a><a href="register.html" class="btn btn-primary">Get Started</a>
        </div>
    </div>

    <main class="container py-5">
        <div id="companyDetailsContainer"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const companyId = params.get('id') || 'google';
        const company = window.careerPilotData.companies.find((item) => item.id === companyId) || window.careerPilotData.companies[0];
        const container = document.getElementById('companyDetailsContainer');
        container.innerHTML = `
        <div class="page-banner mb-5">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            <div class="d-flex align-items-center gap-3">
              <div class="company-logo fs-4">${company.logo}</div>
              <div>
                <h1 class="mb-1 fw-bold">${company.name}</h1>
                <p class="text-muted mb-0">${company.industry}</p>
              </div>
            </div>
            <div>
              <span class="badge badge-soft me-2">Difficulty: ${company.difficulty}</span>
              <a href="interviews.html" class="btn btn-primary">Start Preparation</a>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div class="card p-4 mb-4">
              <h3 class="mb-3">Overview</h3>
              <p class="text-muted">${company.description}</p>
            </div>

            <div class="card p-4 mb-4">
              <h3 class="mb-3">Eligibility</h3>
              <ul class="list-check text-muted">
                ${company.eligibility.map((item) => `<li>${item}</li>`).join('')}
              </ul>
            </div>

            <div class="card p-4 mb-4">
              <h3 class="mb-3">Job Roles</h3>
              <div class="d-flex flex-wrap gap-2">
                ${company.roles.map((role) => `<span class="badge badge-soft">${role}</span>`).join('')}
              </div>
            </div>

            <div class="card p-4 mb-4">
              <h3 class="mb-3">Required Skills</h3>
              <div class="d-flex flex-wrap gap-2">
                ${company.skills.map((skill) => `<span class="badge bg-light text-dark">${skill}</span>`).join('')}
              </div>
            </div>

            <div class="card p-4 mb-4">
              <h3 class="mb-3">Selection Process</h3>
              <div class="timeline flex-column align-items-center">
                ${company.selectionProcess.map((round, index) => `
                  <div class="timeline-step">
                    <div class="timeline-number">${String(index + 1).padStart(2, '0')}</div>
                    <h5>${round.name}</h5>
                    <small class="text-muted">${round.difficulty} • ${round.duration}</small>
                    <p class="small text-muted mt-2">${round.description}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="card p-4 mb-4">
              <h3 class="mb-3">Previous Interview Experiences</h3>
              ${company.experiences.map((exp) => `
                <div class="border rounded p-3 mb-3">
                  <div class="d-flex justify-content-between mb-2"><strong>${exp.round}</strong><span class="badge bg-light text-dark">${exp.difficulty}</span></div>
                  <p class="fw-semibold mb-2">Questions asked:</p>
                  <ul>${exp.questions.map((q) => `<li>${q}</li>`).join('')}</ul>
                  <p><strong>Candidate experience:</strong> ${exp.experience}</p>
                  <p><strong>Preparation tips:</strong> ${exp.preparationTips.join(', ')}</p>
                </div>
              `).join('')}
            </div>

            <div class="card p-4 mb-4">
              <h3 class="mb-3">FAQ</h3>
              <div class="accordion" id="faqAccordion">
                ${company.faqs.map((faq, index) => `
                  <div class="accordion-item">
                    <h2 class="accordion-header" id="heading-${index}">
                      <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${index}" aria-expanded="false" aria-controls="collapse-${index}">${faq.q}</button>
                    </h2>
                    <div id="collapse-${index}" class="accordion-collapse collapse" aria-labelledby="heading-${index}" data-bs-parent="#faqAccordion">
                      <div class="accordion-body text-muted">${faq.a}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card p-4">
              <h4 class="fw-bold mb-3">Preparation recommendations</h4>
              <ul class="list-check text-muted">
                <li>Revise DSA and coding fundamentals</li>
                <li>Practice database design and SQL joins</li>
                <li>Prepare a clear project story with metrics</li>
                <li>Practice mock interviews for confidence</li>
              </ul>
              <a href="practice.html" class="btn btn-primary w-100 mt-3">Start practice</a>
            </div>
          </div>
        </div>
      `;
    </script>
</body>

</html>
