<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Career Pilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container"><a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon"><i
                        class="bi bi-rocket-takeoff"></i></span>CAREER PILOT</a>
            <div class="ms-auto"><a href="dashboard.html" class="btn btn-outline-primary">Dashboard</a></div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="card p-4 p-md-5 mb-4">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="avatar fs-5">AM</div>
                    <div>
                        <h2 class="mb-1">Aarav Mehta</h2>
                        <p class="text-muted mb-0">Computer Science • VIT Vellore</p>
                    </div>
                </div>
                <button type="button" class="btn btn-primary">Edit Profile</button>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card p-4 h-100">
                    <h4 class="mb-4">Profile details</h4>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Name</label><input type="text"
                                    class="form-control" value="Aarav Mehta" /></div>
                            <div class="col-md-6"><label class="form-label">Email</label><input type="email"
                                    class="form-control" value="aarav@careerpilot.ai" /></div>
                            <div class="col-md-6"><label class="form-label">College</label><input type="text"
                                    class="form-control" value="VIT Vellore" /></div>
                            <div class="col-md-6"><label class="form-label">Degree</label><input type="text"
                                    class="form-control" value="B.Tech" /></div>
                            <div class="col-md-6"><label class="form-label">Branch</label><input type="text"
                                    class="form-control" value="Computer Science" /></div>
                            <div class="col-md-6"><label class="form-label">Graduation Year</label><input type="text"
                                    class="form-control" value="2027" /></div>
                            <div class="col-md-12"><label class="form-label">Skills</label><input type="text"
                                    class="form-control" value="JavaScript, React, DBMS, DSA" /></div>
                            <div class="col-md-6"><label class="form-label">Target company</label><input type="text"
                                    class="form-control" value="Google" /></div>
                            <div class="col-md-6"><label class="form-label">Target role</label><input type="text"
                                    class="form-control" value="Software Engineer" /></div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-4">Save changes</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card p-4 h-100">
                    <h4 class="mb-4">Career snapshot</h4>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1"><span>Readiness</span><span>78%</span></div>
                        <div class="progress">
                            <div class="progress-bar" style="width:78%"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1"><span>Practice accuracy</span><span>81%</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width:81%"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1"><span>Interview
                                confidence</span><span>86%</span></div>
                        <div class="progress">
                            <div class="progress-bar" style="width:86%"></div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between mb-1"><span>Resume readiness</span><span>74%</span>
                        </div>
                        <div class="progress">
                            <div class="progress-bar" style="width:74%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
