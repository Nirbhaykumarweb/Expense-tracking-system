<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Career Pilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand brand-mark" href="index.html"><span class="brand-icon"><i
                        class="bi bi-rocket-takeoff"></i></span>CAREER PILOT</a>
            <button class="navbar-toggler border-0" type="button" data-nav-toggle="true"><i
                    class="bi bi-list fs-3"></i></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="companies.html">Companies</a></li>
                    <li class="nav-item"><a class="nav-link" href="practice.html">Practice</a></li>
                    <li class="nav-item"><a class="nav-link" href="interviews.html">Interviews</a></li>
                    <li class="nav-item"><a class="nav-link" href="pricing.html">Pricing</a></li>
                </ul>
                <div class="d-flex gap-2 align-items-center"><a href="login.html"
                        class="btn btn-outline-primary">Login</a></div>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileNav" aria-labelledby="mobileNavLabel">
        <div class="offcanvas-header">
            <h5 id="mobileNavLabel">Career Pilot</h5><button type="button" class="btn-close"
                data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-grid gap-2">
            <a href="index.html" class="btn btn-soft text-start">Home</a>
            <a href="companies.html" class="btn btn-soft text-start">Companies</a>
            <a href="practice.html" class="btn btn-soft text-start">Practice</a>
            <a href="interviews.html" class="btn btn-soft text-start">Interviews</a>
            <a href="pricing.html" class="btn btn-soft text-start">Pricing</a>
            <a href="login.html" class="btn btn-outline-primary">Login</a>
        </div>
    </div>

    <main class="auth-shell">
        <div class="auth-card">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3"><i class="bi bi-person-plus"></i></div>
                <h2 class="fw-bold">Create your account</h2>
                <p class="text-muted mb-0">Join Career Pilot and start your placement prep.</p>
            </div>

            <form data-submit-message="Registration successful">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Full name</label>
                        <input type="text" class="form-control" id="name" required />
                    </div>
                    <div class="col-md-6">
                        <label for="college" class="form-label">College</label>
                        <input type="text" class="form-control" id="college" required />
                    </div>
                    <div class="col-md-12">
                        <label for="emailReg" class="form-label">Email</label>
                        <input type="email" class="form-control" id="emailReg" required />
                    </div>
                    <div class="col-md-6">
                        <label for="passwordReg" class="form-label">Password</label>
                        <input type="password" class="form-control" id="passwordReg" required />
                    </div>
                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label">Confirm password</label>
                        <input type="password" class="form-control" id="confirmPassword" required />
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4">Create account</button>
                <div class="text-center small text-muted mt-3">Already have an account? <a href="login.html">Log in</a>
                </div>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
